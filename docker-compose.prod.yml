# Production (behind aside-edge):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  backend:
    environment:
      NODE_ENV: production
      DEV_AUTH_BYPASS: "0"
      APP_ORIGIN: ${APP_ORIGIN:?Задайте APP_ORIGIN в файле .env}
      JWT_SECRET: ${JWT_SECRET:?Задайте JWT_SECRET в файле .env}

  frontend:
    ports: !reset []
    expose:
      - "80"
    volumes: !reset []
    networks:
      default: {}
      edge:
        aliases:
          - ideas

networks:
  edge:
    external: true
