<!DOCTYPE html>
<html lang="ru" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efe7dc">
  <title>Диктовка</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%239d2c22'/%3E%3Crect x='13' y='6' width='6' height='12' rx='3' fill='white'/%3E%3Cpath d='M9 15a7 7 0 0 0 14 0' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M16 22v4' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css">
</head>
<body class="state-idle">
  <main>
    <header>
      <h1>Диктовка</h1>
      <p class="lede">Говорите — слова появляются сразу. Звук остаётся на телефоне.</p>
    </header>

    <p id="status" role="status">
      <strong id="state-label">Ожидание</strong>
      <span id="state-detail">Первый запуск скачает модель, около 44 МБ. Потом диктовка работает без сети.</span>
    </p>

    <label class="transcript-label" for="transcript">Текст</label>
    <textarea id="transcript" rows="8" placeholder="Здесь будет текст" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
    <p id="interim" class="interim"></p>

    <div class="tools">
      <button type="button" id="copy">Копировать</button>
      <button type="button" id="clear">Очистить</button>
    </div>

    <div id="progress" class="progress" hidden>
      <div id="progress-bar"></div>
    </div>

    <div class="dock">
      <button type="button" id="talk" class="talk" aria-pressed="false">Говорить</button>
      <p class="hint">Откройте страницу в Chrome по HTTPS. Запись никуда не отправляется.</p>
    </div>
  </main>
  <script src="vendor/vosk.js"></script>
  <script src="app.js"></script>
</body>
</html>
